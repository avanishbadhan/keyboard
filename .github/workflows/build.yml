name: Build ZMK Firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Firmware
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cache west modules
        uses: actions/cache@v3
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk
          key: ${{ runner.os }}-build-${{ env.cache-name }}

      - name: Initialize workspace and pull ZMK
        run: |
          pip3 install west
          west init -m https://github.com/zmkfirmware/zmk --mr main workspace
          cd workspace
          west update
          west zephyr-export

      - name: Compile Custom 75 Firmware
        run: |
          cd workspace/app
          west build -b nice_nano_v2 -- -DSHIELD=custom_75 -DZMK_CONFIG="${{ github.workspace }}/firmware/config"

      - name: Archive Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: custom_75_firmware
          path: workspace/app/build/zephyr/zmk.uf2
